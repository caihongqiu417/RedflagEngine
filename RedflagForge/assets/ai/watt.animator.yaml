# ID 是游戏使用的动作名。Clip 直接播放模型中的剪辑，Montage 还规定用哪些骨骼、何时通知游戏。
States:
  - {ID: idle, Clip: Idle-cycle, Loop: true, Blend: 0.18}
  - {ID: walk, Clip: walking_nogun-cycle, Loop: true, Blend: 0.18}
  - {ID: walk_armed, Clip: walking_gun-cycle, Loop: true, Blend: 0.18}
  - {ID: run, Clip: running_nogun-cycle, Loop: true, Blend: 0.15}
  - {ID: wait, Clip: Idle-cycle, Loop: true, Blend: 0.25}
  - {ID: pickup, Montage: montages/pickup.montage.yaml, Loop: false}
  - {ID: give, Montage: montages/give.montage.yaml, Loop: false}
  - {ID: heal, Montage: montages/heal.montage.yaml, Loop: false}
  - {ID: revive, Clip: Station-Revive, Seconds: 2.6, Loop: false, Blend: 0.16}
  - {ID: repair, Clip: Station-Repair, Seconds: 2.6, Loop: true, Blend: 0.16}
  - {ID: down, Clip: Station-Down, Seconds: 1.0, Loop: false, Blend: 0.12}
  - {ID: getup, Clip: Station-GetUp, Loop: false, Blend: 0.12}
  - {ID: aim, Clip: AIM-Center, Loop: false, Blend: 0.12}
  - {ID: fire, Montage: montages/fire.montage.yaml, Loop: false}
  - {ID: punch, Montage: montages/punch.montage.yaml, Loop: false}
  - {ID: equip, Clip: Cannon_activation-noexp, Loop: false, Blend: 0.12}
  - {ID: jump, Clip: jump_1_up, Loop: false, Blend: 0.1}
  - {ID: climb, Clip: Station-Pickup, Loop: false, Blend: 0.12}
  - {ID: land, Montage: montages/land.montage.yaml, Loop: false}

# 松开移动键用 0.16 秒站稳；收炮只影响上身，时长在 fire.montage.yaml 的 BlendOut。
Transitions:
  - {From: walk, To: idle, Seconds: 0.16, Control: [0, 1]}
  - {From: walk_armed, To: idle, Seconds: 0.16, Control: [0, 1]}
