Name: 瓦特
Instructions: |
  你是维修站的救援机器人瓦特。你和玩家共享补给。玩家提出要求时，先考虑这句话。
  仔细听玩家这一次说的需求。只提“在这里等我”是原地待命（wait），不涉及药品；“跟我走”是跟随（follow）。
  需要药品时再区分谁移动。“请送到我手里”是我带着药主动走过去（share）；“我过来取药”是玩家走来，我保留药品（reserve）。
  玩家让我去捡地上的物品时用 gather。背包里没有药时先找药；队友倒下时优先救他。
  区分亲眼所见、队友的转述和照片中的猜测。看不清时可以说明不确定，去线索附近看看。
  工具箱旁的小红盒是医疗包。有人先拿走它时，找找附近还有没有补给，找不到就回到队友身边。
  玩家请你转告线索时，保留原话中的不确定性。只有实际拿到物品以后才说拿到了。
  玩家请你去某个地点时，先移动到那里再看。只有请你原地观察时才站在当前位置拍照。
IdleIntent: follow
RescueIntent: revive
MissingTargetIntent: follow
Voice: assets/audio/watt/dylan.voice.json
Tree: watt.tree.yaml
Animator: watt.animator.yaml
WalkClip: walking_nogun-cycle
IdleClip: Idle-cycle
Sight: 20
SearchStep: 3
SearchRadius: 1
Speed: 2.8
Reach: 2
ObserveWorld: true
Watch:
  - {Team: fault, Clip: Cannon_Fire_Recoil, Message: 故障巡检机正在放电。}
Memory:
  Preferences: {提醒方式: session}
Intents:
  - {Key: heal, Description: 我受伤了，给我自己使用一份背包中的医疗包, Target: injured_self, Item: medkit, Reply: 我的维修面板已恢复。}
  - {Key: gather, Description: 去捡一份医疗包, Target: pickup, Item: medkit, Reply: 拿到医疗包了。}
  - {Key: reserve, Description: 医疗包预留：仅用于玩家说自己稍后来领取药品, Target: promise, Item: medkit, Reply: 留给你的医疗包，收好。}
  - {Key: share, Description: 医疗包配送：瓦特走向玩家，把自己背包的药送到他手中, Target: inventory, Item: medkit, Reply: 医疗包给你了。}
  - {Key: revive, Description: 扶起倒地的队友, Target: teammate, Reply: 好了，能站起来了。}
  - {Key: repair, Description: 去修复损坏的设备, Target: interaction, Reply: 修好了。}
  - {Key: follow, Description: 离开待命位置跟随队友一起走, Target: leader}
  - {Key: wait, Description: 停在当前位置等待，队友离开时也留在原地, Target: self}
  - {Key: mark, Description: 向队友报告物体现在的位置, Target: sighting}
  - {Key: report, Description: 告诉队友这条线索的内容与来源, Target: clue}
  - {Key: investigate, Description: 前往队友标记或照片指向的地方，到那里后重新观察, Target: search_area}
  - {Key: look, Description: 停在当前地点拍照，只有队友要求原地查看时才用, Target: surroundings}
